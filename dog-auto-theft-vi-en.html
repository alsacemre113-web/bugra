<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dog Auto Theft VI ($DAT)</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#120a24;--deep:#1c0f3a;--pink:#ff2e93;--orange:#ff9a3c;--sun:#ffd23f;--cyan:#2de2e6;--violet:#8a4dff;--text:#f6efff;--muted:#b9a8d9;color-scheme:dark;
--hd:"Bowlby One","Arial Black",Impact,sans-serif;--bd:"DM Sans",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--night);color:var(--text);font:400 17px/1.6 var(--bd);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--hd);font-weight:400;line-height:1.05;margin:0}
h2{font-size:clamp(32px,6vw,54px);margin-bottom:12px}
p{margin:0 0 1em;max-width:62ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(18,10,36,.85);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
nav b{font-family:var(--hd);font-weight:400;font-size:18px;white-space:nowrap}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
nav ul a{text-decoration:none;color:var(--muted)}nav ul a:hover{color:var(--text)}
.btn{display:inline-block;font:700 16px var(--bd);padding:13px 24px;border-radius:999px;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.main{background:linear-gradient(90deg,var(--pink),var(--orange));color:#1a0a22}
.btn.main:hover{filter:brightness(1.1)}
.btn.line{border-color:var(--cyan);color:var(--cyan);background:none}
.btn.line:hover{background:#2de2e61a}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hero{position:relative;text-align:center;padding:56px 0 90px;background:linear-gradient(180deg,#2a0f5e 0%,#7a1f8f 38%,#ff4f8b 68%,#ff9a3c 100%);overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,transparent,var(--night))}
.hero .wrap{position:relative;z-index:1}
.logo{width:min(560px,88%);height:auto;display:block;margin:0 auto 22px;border-radius:18px;background:#000;box-shadow:0 0 0 3px var(--sun),0 0 60px #ff2e93aa;animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.hero p{margin:0 auto 24px;font-size:20px;color:#fff;text-shadow:0 2px 12px #0008}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ca{margin:30px auto 0;display:inline-flex;align-items:center;gap:10px;background:#120a24cc;border:1px solid #ffffff33;border-radius:14px;padding:8px 8px 8px 16px;max-width:100%}
.ca code{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sun)}
.ca button{font:700 14px var(--bd);background:var(--sun);color:#1a0a22;border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
section{padding:84px 0}
.sub{color:var(--muted);margin-bottom:36px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about img{width:100%;max-width:340px;justify-self:center;border-radius:50%;box-shadow:0 0 0 3px var(--pink),0 0 50px #8a4dff88}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.facts div{border-left:3px solid var(--pink);padding:2px 0 2px 12px}
.facts span{display:block;color:var(--muted);font-size:14px}
.facts strong{font-family:var(--hd);font-weight:400;font-size:20px}
.tok{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:48px;align-items:center}
.donut{position:relative;width:100%;max-width:420px;margin:0 auto}
.donut svg{width:100%;height:auto;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:34;transition:stroke-width .2s,opacity .2s;cursor:pointer}
.donut.hov circle{opacity:.35}.donut.hov circle.on{opacity:1;stroke-width:42}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.mid b{font-family:var(--hd);font-weight:400;font-size:clamp(34px,8vw,52px)}
.mid span{color:var(--muted);font-size:14px;max-width:130px}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--deep);cursor:pointer;border:1px solid transparent}
.legend li.on,.legend li:hover{border-color:#ffffff40}
.legend i{width:16px;height:16px;border-radius:5px}
.legend em{font-style:normal;font-family:var(--hd);font-size:18px}
.legend small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.note{margin-top:18px;color:var(--muted);font-size:14px}
.road{position:relative;list-style:none;margin:0;padding:0 0 0 34px}
.road::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--cyan),var(--pink),var(--orange))}
.road li{position:relative;margin-bottom:28px;background:var(--deep);border-radius:18px;padding:22px 24px}
.road li::before{content:"";position:absolute;left:-34px;top:26px;width:22px;height:22px;border-radius:50%;background:var(--night);border:4px solid var(--c)}
.road li:nth-child(1){--c:var(--cyan)}.road li:nth-child(2){--c:var(--violet)}.road li:nth-child(3){--c:var(--pink)}.road li:nth-child(4){--c:var(--orange)}
.road h3{font-size:24px;margin-bottom:4px}
.road .tag{display:inline-block;font-size:13px;font-weight:700;color:var(--c);margin-bottom:10px}
.road ul{margin:0;padding-left:20px;color:#e4d9f7}
.road li li{all:unset;display:list-item;margin:4px 0}
.buy{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;list-style:none;padding:0;margin:0;counter-reset:s}
.buy li{counter-increment:s;background:var(--deep);border-radius:18px;padding:20px;border-top:4px solid var(--pink)}
.buy li::before{content:counter(s);display:block;font-family:var(--hd);font-size:34px;color:var(--sun);margin-bottom:6px}
.buy b{display:block;margin-bottom:4px}
.buy span{color:var(--muted);font-size:15px}
footer{padding:48px 0 60px;border-top:1px solid #ffffff14;text-align:center;color:var(--muted);font-size:14px}
footer .socials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
footer p{margin:0 auto 10px}
@media(max-width:820px){nav ul{display:none}.about,.tok{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr 1fr}.buy{grid-template-columns:1fr 1fr}section{padding:60px 0}}
@media(max-width:480px){.buy{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.road li:nth-child(n+5){--c:var(--sun)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:700 15px var(--bd);background:var(--sun);color:#1a0a22;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;box-shadow:0 6px 24px #0008}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:30;background:#190d33;border-left:1px solid #ffffff30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ffffff20}
.dh b{font-family:var(--hd);font-weight:400;font-size:18px}
.db{overflow:auto;padding:6px 16px 20px;flex:1}
.db h4{margin:22px 0 8px;font:700 15px var(--bd);color:var(--sun)}
.db label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.db input,.db textarea{width:100%;font:15px var(--bd);color:var(--text);background:#0d0720;border:1px solid #ffffff30;border-radius:9px;padding:9px 10px}
.db textarea{min-height:84px;resize:vertical}
.db input[type=color]{padding:2px;height:36px}
.row{display:grid;grid-template-columns:1fr 80px 54px;gap:8px}
.card{border:1px solid #ffffff20;border-radius:12px;padding:4px 12px 12px;margin-top:10px}
.sm{font:600 13px var(--bd);background:#ffffff14;color:var(--text);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;margin-top:10px}
.sm.red{color:#ff8aa8}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff20;display:grid;gap:8px}
.df .btn{width:100%;text-align:center}
.st{font-size:13px;color:var(--muted);min-height:18px}.st.bad{color:#ff8aa8}
</style>
</head>

<script>
var CFG=JSON.parse(document.getElementById("cfg").textContent);
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return n>=1e9?+(n/1e9).toFixed(2)+" Billion":n>=1e6?+(n/1e6).toFixed(2)+" Million":n.toLocaleString("en-US")}
function app(){var c=CFG;
$("#app").innerHTML=
'<nav><div class="wrap"><b>'+esc(c.brand)+'</b><ul><li><a href="#about">About</a></li><li><a href="#tokenomics">Tokenomics</a></li><li><a href="#roadmap">Roadmap</a></li><li><a href="#how-to-buy">How to buy</a></li></ul><a class="btn main" href="#how-to-buy">Buy '+esc(c.ticker)+'</a></div></nav>'+
'<header class="hero"><div class="wrap"><img class="logo" src="'+esc(c.logo)+'" alt="'+esc(c.brand)+' logo"><p>'+esc(c.tagline)+'</p><div class="cta"><a class="btn main" href="#how-to-buy">Buy '+esc(c.ticker)+'</a><a class="btn line" href="#roadmap">View roadmap</a></div><div class="ca"><code id="ca">'+esc(c.contract)+'</code><button id="copy" type="button">Copy</button></div></div></header>'+
'<section id="about"><div class="wrap about"><div><h2>'+esc(c.aboutTitle)+'</h2><p>'+esc(c.aboutText)+'</p><div class="facts"><div><span>Ticker</span><strong>'+esc(c.ticker)+'</strong></div><div><span>Network</span><strong>'+esc(c.chain)+'</strong></div><div><span>Total supply</span><strong>'+esc(fmt(c.supply))+'</strong></div></div></div><img src="'+esc(c.badge)+'" alt="Dog with sunglasses badge"></div></section>'+
'<section id="tokenomics" style="background:linear-gradient(180deg,var(--night),#180c33 50%,var(--night))"><div class="wrap"><h2>Tokenomics</h2><p class="sub">Total supply: '+esc(fmt(c.supply))+' '+esc(c.ticker)+'. Tap a slice for details.</p><div class="tok"><div class="donut" id="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Token distribution chart"></svg><div class="mid"><b id="midp">100%</b><span id="midl">'+esc(fmt(c.supply))+' '+esc(c.ticker)+'</span></div></div><div><ul class="legend" id="legend"></ul></div></div></div></section>'+
'<section id="roadmap"><div class="wrap"><h2>Roadmap</h2><p class="sub">'+esc(c.roadSub)+'</p><ol class="road">'+c.phases.map(function(p){return '<li><h3>'+esc(p.title)+'</h3><span class="tag">'+esc(p.tag)+'</span><ul>'+p.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul></li>'}).join("")+'</ol></div></section>'+
'<section id="how-to-buy" style="padding-top:0"><div class="wrap"><h2>How to buy</h2><p class="sub">From your wallet to '+esc(c.ticker)+' in four steps.</p><ol class="buy">'+c.steps.map(function(s){return '<li><b>'+esc(s.title)+'</b><span>'+esc(s.text)+'</span></li>'}).join("")+'</ol></div></section>'+
'<footer><div class="wrap"><div class="socials">'+c.links.map(function(l){return '<a class="btn line" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>'}).join("")+'</div><p>'+esc(c.disc1)+'</p><p>'+esc(c.disc2)+'</p></div></footer>';
bind()}
function bind(){var c=CFG,svg=$("#donut svg"),lg=$("#legend"),donut=$("#donut"),mp=$("#midp"),ml=$("#midl"),R=80,C=2*Math.PI*R,off=0,NS="http://www.w3.org/2000/svg",els=[];
var tot=c.supply,full=fmt(tot)+" "+c.ticker;
var bg=document.createElementNS(NS,"circle");bg.setAttribute("cx",100);bg.setAttribute("cy",100);bg.setAttribute("r",R);bg.style.stroke="#ffffff10";bg.style.pointerEvents="none";svg.appendChild(bg);
c.tokens.forEach(function(x){var len=C*x.p/100,k=document.createElementNS(NS,"circle");
k.setAttribute("cx",100);k.setAttribute("cy",100);k.setAttribute("r",R);k.style.stroke=x.c;k.setAttribute("stroke-dasharray",Math.max(len-1.6,0)+" "+(C-Math.max(len-1.6,0)));k.setAttribute("stroke-dashoffset",-off);off+=len;svg.appendChild(k);
var li=document.createElement("li");li.tabIndex=0;li.innerHTML='<i style="background:'+esc(x.c)+'"></i><div>'+esc(x.n)+'<small>'+esc(x.d)+'</small></div><em>'+esc(x.p)+'%</em>';lg.appendChild(li);els.push([k,li]);
function on(){donut.classList.add("hov");els.forEach(function(e){e[0].classList.remove("on");e[1].classList.remove("on")});k.classList.add("on");li.classList.add("on");mp.textContent=x.p+"%";ml.textContent=x.n+" · "+fmt(tot*x.p/100)}
function offf(){donut.classList.remove("hov");k.classList.remove("on");li.classList.remove("on");mp.textContent="100%";ml.textContent=full}
[k,li].forEach(function(t){t.addEventListener("mouseenter",on);t.addEventListener("mouseleave",offf);t.addEventListener("click",on)});li.addEventListener("focus",on);li.addEventListener("blur",offf)});
$("#copy").addEventListener("click",function(){var b=this;try{navigator.clipboard.writeText($("#ca").textContent)}catch(e){}b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1600)})}
/* ---------- editor ---------- */
function F(l,p,o){o=o||{};var v=p.split(".").reduce(function(a,k){return a[k]},CFG);if(o.lines)v=v.join("\n");
var a=' data-p="'+p+'"'+(o.lines?' data-lines="1"':'')+(o.num?' data-num="1"':'');
return '<label>'+l+'</label>'+(o.area||o.lines?'<textarea'+a+'>'+esc(v)+'</textarea>':'<input'+a+' type="'+(o.type||"text")+'" value="'+esc(v)+'">')}
function ed(){var c=CFG,h='',sum=c.tokens.reduce(function(s,t){return s+(+t.p||0)},0);
h+='<div class="dh"><b>Site editörü</b><button class="sm" data-a="close" type="button">Kapat</button></div><div class="db">';
h+='<h4>Genel</h4>'+F("Proje adı","brand")+F("Ticker","ticker")+F("Ağ (chain)","chain")+F("Toplam arz (sayı)","supply",{num:1})+F("Kontrat adresi","contract")+F("Slogan","tagline",{area:1})+F("Hakkında başlığı","aboutTitle")+F("Hakkında metni","aboutText",{area:1});
h+='<h4>Linkler</h4>'+c.links.map(function(l,i){return '<div class="card">'+F("Buton adı","links."+i+".name")+F("URL","links."+i+".url")+'<button class="sm red" data-a="dl:'+i+'" type="button">Sil</button></div>'}).join("")+'<button class="sm" data-a="al" type="button">+ Link ekle</button>';
h+='<h4>Tokenomics (toplam: '+(+sum.toFixed(2))+'%)</h4>'+(sum!==100?'<div class="st bad">Toplam %100 olmalı.</div>':'')+c.tokens.map(function(t,i){return '<div class="card">'+F("Ad","tokens."+i+".n")+'<div class="row"><div>'+F("Açıklama","tokens."+i+".d")+'</div><div>'+F("%","tokens."+i+".p",{num:1})+'</div><div>'+F("Renk","tokens."+i+".c",{type:"color"})+'</div></div><button class="sm red" data-a="dt:'+i+'" type="button">Sil</button></div>'}).join("")+'<button class="sm" data-a="at" type="button">+ Dilim ekle</button>';
h+='<h4>Roadmap</h4>'+F("Alt başlık","roadSub")+c.phases.map(function(p,i){return '<div class="card">'+F("Faz başlığı","phases."+i+".title")+F("Etiket","phases."+i+".tag")+F("Maddeler (her satıra bir madde)","phases."+i+".items",{lines:1})+'<button class="sm red" data-a="dp:'+i+'" type="button">Sil</button></div>'}).join("")+'<button class="sm" data-a="ap" type="button">+ Faz ekle</button>';
h+='<h4>Nasıl alınır</h4>'+c.steps.map(function(s,i){return '<div class="card">'+F("Başlık","steps."+i+".title")+F("Metin","steps."+i+".text")+'<button class="sm red" data-a="ds:'+i+'" type="button">Sil</button></div>'}).join("")+'<button class="sm" data-a="as" type="button">+ Adım ekle</button>';
h+='<h4>Alt bilgi</h4>'+F("Uyarı 1","disc1",{area:1})+F("Uyarı 2","disc2",{area:1});
h+='</div><div class="df"><div class="st" id="st"></div><button class="btn main" data-a="save" type="button"'+(sum!==100?' disabled':'')+'>Kaydet ve yayınla</button></div>';
$("#ed").innerHTML=h}
function setP(p,v){var k=p.split("."),o=CFG;for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function build(){var d=document.documentElement.cloneNode(true);d.querySelector("#app").innerHTML="";d.querySelector("#ed").innerHTML="";d.querySelector("#ed").classList.remove("open");d.querySelector("#fab").hidden=true;
d.querySelector("#cfg").textContent=JSON.stringify(CFG).replace(/</g,"\\u003c");return "<!DOCTYPE html>\n"+d.outerHTML}
var art=null;
function wire(){var E=$("#ed");
E.addEventListener("input",function(e){var t=e.target,p=t.dataset.p;if(!p)return;var v=t.value;if(t.dataset.num)v=parseFloat(v)||0;if(t.dataset.lines)v=v.split("\n").map(function(s){return s.trim()}).filter(Boolean);setP(p,v);app();
if(p.indexOf("tokens.")===0&&/\.p$/.test(p)){var s=CFG.tokens.reduce(function(a,x){return a+(+x.p||0)},0);E.querySelector("h4:nth-of-type(3)").textContent="Tokenomics (toplam: "+(+s.toFixed(2))+"%)"}});
E.addEventListener("change",function(e){if(e.target.dataset.p&&/tokens\.\d+\.p$/.test(e.target.dataset.p))ed()});
E.addEventListener("click",function(e){var a=e.target.dataset.a;if(!a)return;var m=a.split(":"),i=+m[1],c=CFG;
if(a==="close"){E.classList.remove("open");return}
if(a==="al")c.links.push({name:"New link",url:"#"});else if(m[0]==="dl")c.links.splice(i,1);
else if(a==="at")c.tokens.push({n:"New allocation",p:0,c:"#ffffff",d:"Description"});else if(m[0]==="dt")c.tokens.splice(i,1);
else if(a==="ap")c.phases.push({title:"New phase",tag:"Tag",items:["New goal"]});else if(m[0]==="dp")c.phases.splice(i,1);
else if(a==="as")c.steps.push({title:"New step",text:"Describe the step."});else if(m[0]==="ds")c.steps.splice(i,1);
else if(a==="save"){var st=$("#st");if(!art){st.textContent="Kaydetme bu görünümde kullanılamıyor.";return}st.className="st";st.textContent="Yayınlanıyor...";
art.publish(build()).catch(function(err){st.className="st bad";st.textContent="Kaydedilemedi: "+((err&&err.message)||(err&&err.code)||"bilinmeyen hata")});return}
ed();app()})}
app();ed();wire();
$("#fab").addEventListener("click",function(){$("#ed").classList.add("open")});
(async function(){try{if(!window.claude)return;var u=await claude.use("user");if(!u||!u.canEdit())return;art=await claude.use("artifact");$("#fab").hidden=false}catch(e){}})();
</script>
</body>
